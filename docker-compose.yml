services:
  tiktokarchive-blazor:
    image: ${DOCKER_REGISTRY-}tiktokarchiveblazor
    build:
      context: .
      dockerfile: TikTokArchive.Web/Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - OpenSearch:Url=http://opensearch:9200
      - SpeechToText:Enabled=true
      - SpeechToText:Url=http://whisper-asr:9000
      - AiEnrichment:Enabled=true
      - AiEnrichment:Url=http://ollama:11434
      - AiEnrichment:Model=llama3.2:3b
    volumes:
      - ./media:/media
      # Drop video files here and the local import service will ingest them.
      - ./dropfolder:/dropfolder
    depends_on:
      opensearch:
        condition: service_healthy
      # No health condition on whisper-asr / ollama: the transcription and AI-enrichment
      # workers' backoff absorbs the first-run model downloads, so app startup never blocks
      # on those containers.

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Speech-to-text engine. Bundles ffmpeg, so the app POSTs the raw video file and the
  # service extracts/decodes the audio itself. CPU-only with the faster_whisper engine.
  whisper-asr:
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment:
      - ASR_ENGINE=faster_whisper
      - ASR_MODEL=base                # tiny/small/medium also valid; base is a good CPU default
      - ASR_MODEL_PATH=/data/whisper
      # - ASR_DEVICE=cuda             # uncomment (and add a GPU reservation) to use an NVIDIA GPU
    volumes:
      - whisper_cache:/data/whisper   # persist the downloaded model across restarts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:9000/docs')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s              # first start downloads the model (~150MB for base)

  # Local LLM for AI summaries + tags. The app POSTs the transcript + caption and gets back a
  # JSON object with a short summary and topical tags. CPU-only by default; for an NVIDIA GPU,
  # uncomment the deploy block (and install the NVIDIA Container Toolkit on the host).
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama     # persist pulled models across restarts
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  # One-shot: pull the enrichment model once the server is up so the stack is self-provisioning.
  # Exits when the pull completes; re-running `docker compose up` is a no-op once cached.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: ["pull", "llama3.2:3b"]
    restart: "no"

volumes:
  opensearch_data:
  whisper_cache:
  ollama_data:
